services:
  showdown-mysql:
    image: "mysql:8.4.4"
    environment:
      - "MYSQL_DATABASE=competition_data"
      - "MYSQL_PASSWORD=secret"
      - "MYSQL_ROOT_PASSWORD=verysecret"
      - "MYSQL_USER=bingo_admin"
    ports:
      - "3001:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER --password=$$MYSQL_PASSWORD",
        ]
      start_period: 3s
      interval: 3s
      timeout: 3s
      retries: 5
networks:
  showdown-network:
    driver: bridge
